  function mcView(){
    const q = S.list[S.round], rev = S.phase === "mc-rev", answered = Object.keys(S.answers).length, herd = q.kind === "herd";
    const counts = rev ? S.last.counts : null;
    const isRight = i => herd ? S.last.majority.includes(i) : i === q.correct;
    const head = q.kind === "emoji" ? `<div class="emoji">${esc(q.text)}</div><div class="hint">Which movie is this?</div>` : `<div class="qtext">${esc(q.text)}</div>`;
    return `<section class="stage card">
      <div class="qhead"><span class="label">${esc(GAMES[S.game].name)} · ${S.round+1} of ${S.total}</span>
        <span class="pill">${rev ? (herd ? "Most popular" : "Answer") : `<b data-left>${secsLeft()}</b> s · <b>${answered}/${online().length}</b> answered`}</span></div>
      ${rev ? "" : timer((q.time||CFG.quizSec)*1000)}
      <div class="qgrid ${q.img ? "has-img" : ""}">${q.img ? `<img class="qimg" src="${q.img}" alt="Question picture">` : ""}<div>${head}</div></div>
      <div class="opts ${q.options.length === 2 ? "two" : ""}">${q.options.map((o,i) => `<div class="opt ${rev ? (isRight(i)?'right':'dim') : ''}" style="--c:${OPT_COLORS[i]}"><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span>${rev?`<span class="cnt">${counts[i]}</span>`:""}</div>`).join("")}</div>
      ${rev ? `${leaderboard()}<div class="row"><button class="big" data-act="next">${S.round+1>=S.total ? "Show winners" : "Next ▶"}</button></div>`
            : `<div class="row"><button class="ghost sm" data-act="skip">Reveal now</button></div>`}
    </section>`;
  }
  function tapLive(){
    if (S.mode === "teams" && S.teamCount === 2) {
      const a = tapAvg(), d = a[0].v - a[1].v, pos = Math.max(-45, Math.min(45, -d * 2.2));
      return `<div class="rope"><div class="side" style="--c:${TEAMS[0].c}">${esc(TEAMS[0].name)}<b>${fmt(Math.round(a[0].v*10)/10)}</b></div>
        <div class="track"><div class="mid"></div><div class="knot" style="left:calc(50% + ${pos}%)" aria-label="Rope marker"></div></div>
        <div class="side" style="--c:${TEAMS[1].c}">${esc(TEAMS[1].name)}<b>${fmt(Math.round(a[1].v*10)/10)}</b></div></div>`;
    }
    if (S.mode === "teams") return bars(tapAvg().map(a => ({name:TEAMS[a.id].name, c:TEAMS[a.id].c, v:Math.round(a.v*10)/10})), " taps");
    const top = plist().map(([pid,p]) => ({name:p.name, c:"var(--t2)", v:S.answers[pid]||0})).sort((a,b) => b.v-a.v).slice(0, 8);
    return bars(top, " taps");
  }
  function tapView(){
    if (S.phase === "tap-ready") return `<section class="stage card center"><span class="label">Round ${S.round+1} of ${S.total}</span><h2>Get ready to tap!</h2><div class="big-num" data-left>${secsLeft()}</div></section>`;
    if (S.phase === "tap") return `<section class="stage card"><div class="qhead"><span class="label">Round ${S.round+1} of ${S.total} · ${S.mode==="teams" ? "average taps per player" : "top tappers"}</span><span class="pill"><b data-left>${secsLeft()}</b> s</span></div>
      ${timer(CFG.tapSec*1000)}<div class="qtext">TAP! TAP! TAP!</div><div id="rope">${tapLive()}</div></section>`;
    const P = S.last.pub;
    return `<section class="stage card"><span class="label">Round ${S.round+1} result</span>
      ${S.mode === "teams" ? bars(P.avg.map(a => ({name:TEAMS[a.id].name, c:TEAMS[a.id].c, v:a.v})), " taps") : bars(P.solo.map(s => ({name:s.name, c:"var(--t2)", v:s.v})), " taps")}
      ${leaderboard()}<div class="row"><button class="big" data-act="next">${S.round+1>=S.total ? "Show winners" : "Next round ▶"}</button></div></section>`;
  }
  function reactView(){
    if (S.phase === "react-wait") return `<section class="stage card center react wait"><span class="label">Round ${S.round+1} of ${S.total}</span><h2>Wait for green…</h2><p class="muted">Tapping now counts as too early.</p></section>`;
    if (S.phase === "react-go") return `<section class="stage card center react go"><h2>TAP NOW!</h2><p><b>${Object.keys(S.answers).length}</b> tapped</p></section>`;
    const P = S.last.pub;
    return `<section class="stage card"><span class="label">Round ${S.round+1} · fastest</span>
      <ol class="board">${P.fastest.map((f,i) => `<li><span class="rk">${i+1}</span><span class="nm">${Avatar.svg(f.av, 30)}<span>${esc(f.name)}</span></span><b>${Math.round(f.ms)} ms</b></li>`).join("") || `<li>Nobody tapped in time</li>`}</ol>
      ${P.early ? `<p class="muted">${P.early} tapped too early.</p>` : ""}
      ${leaderboard()}<div class="row"><button class="big" data-act="next">${S.round+1>=S.total ? "Show winners" : "Next round ▶"}</button></div></section>`;
  }
  function guessView(){
    const q = S.list[S.round];
    if (S.phase === "guess") return `<section class="stage card"><div class="qhead"><span class="label">Closest Guess · ${S.round+1} of ${S.total}</span>
      <span class="pill"><b data-left>${secsLeft()}</b> s · <b>${Object.keys(S.answers).length}/${online().length}</b> guessed</span></div>
      ${timer(CFG.guessSec*1000)}<div class="qtext">${esc(q[0])}</div><p class="muted">Type a number on your phone. Exact answers score 200.</p>
      <div class="row"><button class="ghost sm" data-act="skip">Reveal now</button></div></section>`;
    const L = S.last;
    return `<section class="stage card"><span class="label">Closest Guess · ${S.round+1} of ${S.total}</span><div class="qtext">${esc(q[0])}</div>
      <div class="row"><span class="label">Answer</span><span class="big-num">${fmt(q[1])}</span><span class="muted">${esc(q[2])}</span></div>
      ${S.mode === "teams" ? `<div class="label">Team middle guess</div><div class="bars">${L.teamMed.map(r => `<div class="bar" style="--c:${TEAMS[r.id].c}"><div class="nm">${esc(TEAMS[r.id].name)}</div><div>${r.med === null ? `<span class="muted">No guesses</span>` : `<b>${fmt(r.med)}</b> <span class="muted">· off by ${fmt(Math.abs(r.med - q[1]))}</span>`}</div><div></div></div>`).join("")}</div>`
        : `<div class="label">Closest players</div><ol class="board">${L.closest.map((c,i) => `<li><span class="rk">${i+1}</span><span class="nm">${Avatar.svg(c.av, 30)}<span>${esc(c.name)}</span></span><b>${fmt(c.v)}</b></li>`).join("")}</ol>`}
      ${leaderboard()}<div class="row"><button class="big" data-act="next">${S.round+1>=S.total ? "Show winners" : "Next ▶"}</button></div></section>`;
  }
  function impView(){
    const nm = pid => S.players[pid] ? esc(S.players[pid].name) : "?";
    if (S.phase === "imp-talk") return `<section class="stage card"><div class="qhead"><span class="label">Guess the Imposter · round ${S.round+1} of ${S.total}</span><span class="pill"><b data-left>${secsLeft()}</b> s to talk</span></div>
      ${timer(CFG.impTalkSec*1000)}
      <ol class="steps"><li>Check your phone. Everyone sees the secret word, except the imposter, who only sees the category.</li><li>Go round your group. Each person says <b>one word</b> linked to the secret word. Don't make it too obvious.</li><li>When the timer ends, vote on your phone for who you think is the imposter.</li></ol>
      <div class="groups">${S.groups.map(g => `<div class="grp"><b>${esc(g.name)}</b> <span class="hint">${g.members.length} players · ${esc(nm(g.first))} starts</span><div class="chips">${g.members.slice(0,10).map(x => `<span class="chip av">${S.players[x] ? Avatar.svg(S.players[x].av, 22) : ""}${nm(x)}</span>`).join("")}${g.members.length>10?`<span class="chip more">+${g.members.length-10}</span>`:""}</div></div>`).join("")}</div>
      <div class="row"><button class="big" data-act="vote">Start voting now</button></div></section>`;
    if (S.phase === "imp-vote") return `<section class="stage card center"><span class="label">Voting</span><h2>Who is the imposter?</h2>
      ${timer(CFG.impVoteSec*1000)}<p><b data-left>${secsLeft()}</b> s · <b>${Object.keys(S.answers).length}</b> votes in</p><div class="row"><button class="ghost sm" data-act="skip">Reveal now</button></div></section>`;
    return `<section class="stage card"><span class="label">Round ${S.round+1} results</span>
      <div class="groups">${S.groups.map(g => { const r = S.last.res[g.name]; return `<div class="grp ${r.caught?'won':'lost'}"><b>${esc(g.name)}</b> · ${r.caught ? "Imposter caught!" : "Imposter escaped!"}
        <div class="improw">${Avatar.svg(r.av, 40)}<span>The imposter was <b>${esc(r.imposter)}</b>.</span></div><div>The word was <b>${esc(r.word)}</b> <span class="hint">(${esc(r.cat)})</span>.</div></div>`; }).join("")}</div>
      ${leaderboard()}<div class="row"><button class="big" data-act="next">${S.round+1>=S.total ? "Show winners" : "Next round ▶"}</button></div></section>`;
  }
  function finalView(){
    const g = GAMES[S.game];
    const btns = `<div class="row center-row"><button class="big" data-act="again">Play again</button><button class="ghost big" data-act="lobby">Back to the room</button><button class="ghost big" data-act="home">All games</button></div>`;
    if (S.mode === "teams") {
      const tr = teams().map(t => ({...t, v:Math.round(teamScore(t.id)), stars: members(t.id).sort((a,b) => b[1].pts - a[1].pts).slice(0,3).map(([,p]) => p)})).sort((a,b) => b.v - a.v);
      const mvp = ranks().top[0], heights = [210, 160, 120];
      const pod = [tr[1], tr[0], tr[2]].filter(Boolean);
      return `<section class="stage card finale"><div class="spot"></div>
        <div class="win-head">${TROPHY}<div><span class="label">${esc(g.name)} · final</span><h2 class="win" style="color:${tr[0].c}">${esc(tr[0].name)} win!</h2></div></div>
        <div class="podium">${pod.map(t => { const place = tr.indexOf(t) + 1; return `<div class="pod p${place}" style="--c:${t.c}">
          <div class="pod-avs">${t.stars.map((p,i) => Avatar.svg(p.av, place === 1 && i === 0 ? 74 : 54, {crown: place === 1 && i === 0})).join("")}</div>
          <div class="tn">${esc(t.name)}</div><div class="pts">${fmt(t.v)} pts</div><div class="blk" style="height:${heights[place-1]}px"><span>${place}</span></div></div>`; }).join("")}</div>
        ${mvp ? `<div class="mvp">${Avatar.svg(mvp.av, 64, {crown:true})}<div><span class="label">Star player</span><div class="mvp-name">${esc(mvp.name)}</div><div class="hint">${fmt(mvp.pts)} points · ${esc(TEAMS[mvp.team] ? TEAMS[mvp.team].name : "")}</div></div></div>` : ""}
        ${btns}</section>`;
    }
    const top = ranks().top, heights = [190, 140, 105];
    const pod = [top[1], top[0], top[2]].filter(Boolean);
    return `<section class="stage card finale"><div class="spot"></div>
      <div class="win-head">${TROPHY}<div><span class="label">${esc(g.name)} · final</span><h2 class="win">${top[0] ? esc(top[0].name) + " wins!" : "Game over"}</h2></div></div>
      <div class="podium">${pod.map(r => { const place = top.indexOf(r) + 1, c = ["var(--t2)","#c0c6d8","#d28b4e"][place-1]; return `<div class="pod p${place}" style="--c:${c}">
        <div class="pod-avs">${Avatar.svg(r.av, place === 1 ? 104 : 78, {crown: place === 1})}</div>
        <div class="tn">${esc(r.name)}</div><div class="pts">${fmt(r.pts)} pts</div><div class="blk" style="height:${heights[place-1]}px"><span>${place}</span></div></div>`; }).join("")}</div>
      ${top.length > 3 ? `<ol class="board narrow">${top.slice(3, 10).map((r,i) => `<li><span class="rk">${i+4}</span><span class="nm">${Avatar.svg(r.av, 30)}<span>${esc(r.name)}</span></span><b>${fmt(r.pts)}</b></li>`).join("")}</ol>` : ""}
      ${btns}</section>`;
  }

  /* ---- quiz editor ---- */
  function editing(){ return Quizzes.all().find(q => q.id === S.editId) || null; }
  function saveQuiz(qz){
    const all = Quizzes.all(), i = all.findIndex(q => q.id === qz.id);
    if (i >= 0) all[i] = qz; else all.push(qz);
    if (!Quizzes.save(all)) { toast("This browser is out of space. Remove some pictures or export and delete old quizzes."); return false; }
    return true;
  }
  function editorView(){
    const all = Quizzes.all(), qz = editing();
    return `<section class="editor">
      <div class="card ed-side"><div class="row spread"><h2 class="h-sm">Your quizzes</h2><button class="sm" data-act="newquiz">+ New quiz</button></div>
        <div class="qzlist">${all.map(q => `<button class="qzitem" data-open="${q.id}" aria-pressed="${q.id===S.editId}"><b>${esc(q.title)}</b><span class="hint">${q.questions.length} question${q.questions.length===1?'':'s'}</span></button>`).join("") || `<p class="hint">No quizzes yet. Make your first one.</p>`}</div>
        <div class="row"><label class="ghost sm filebtn">Import file<input type="file" id="importfile" accept=".json,application/json" hidden></label>
          ${qz ? `<button class="ghost sm" data-act="export">Export this quiz</button>` : ""}</div>
        <p class="hint">Quizzes are saved in this browser on this computer. Export to keep a copy or move it to another computer.</p>
        <button class="big" data-act="back">← Back to the lobby</button></div>
      ${qz ? `<div class="ed-main">
        <div class="card"><label class="label" for="qztitle">Quiz name</label><div class="row"><input id="qztitle" value="${esc(qz.title)}" maxlength="60">
          <button class="ghost sm danger" data-act="delquiz">Delete quiz</button></div>
          <button class="sm" data-act="playthis" ${qz.questions.length?"":"disabled"} style="margin-top:10px">▶ Use this quiz in the next game</button></div>
        <div class="card"><h3 class="h-sm">Add one question</h3>
          <label class="label" for="nq">Question</label><textarea id="nq" rows="2" maxlength="200" placeholder="e.g. Which city is in this picture?"></textarea>
          <div class="row"><label class="ghost sm filebtn">📷 Add picture<input type="file" id="nimg" accept="image/*" hidden></label>
            <span id="nimgprev">${S.editImg ? `<img src="${S.editImg}" alt="" class="thumb"> <button class="ghost sm" data-act="rmimg">Remove</button>` : `<span class="hint">Optional. Shown on the big screen.</span>`}</span></div>
          <div class="optedit">${[0,1,2,3].map(i => `<div class="oe" style="--c:${OPT_COLORS[i]}"><input type="radio" name="ncor" id="ncor${i}" value="${i}" ${i===0?"checked":""} aria-label="Mark option ${i+1} correct"><input id="no${i}" maxlength="60" placeholder="Option ${i+1}${i>1?" (optional)":""}"></div>`).join("")}</div>
          <p class="hint">Pick the dot next to the right answer.</p>
          <div class="row"><label class="label" for="ntime">Time</label><select id="ntime">${[10,20,30,60].map(s => `<option value="${s}" ${s===20?"selected":""}>${s} seconds</option>`).join("")}</select>
            <button data-act="addq">+ Add question</button></div></div>
        <div class="card"><h3 class="h-sm">Add many at once (paste lines)</h3>
          <p class="hint">One question per line. Separate parts with <code>|</code> and put <code>*</code> before the right answer. Add <code>| 30s</code> at the end for a custom time.</p>
          <pre class="eg">What is 5 × 6? | 11 | *30 | 56 | 35
Capital of France? | Rome | *Paris | Madrid | 30s
The Earth is flat. | True | *False</pre>
          <textarea id="lines" rows="5" placeholder="Paste your questions here"></textarea>
          <button data-act="addlines">Add these questions</button></div>
        <div class="card"><h3 class="h-sm">${qz.questions.length} question${qz.questions.length===1?'':'s'}</h3>
          <ol class="qlist">${qz.questions.map((q,i) => `<li>${q.img ? `<img src="${q.img}" alt="" class="thumb">` : ""}<div class="qli"><b>${esc(q.text)}</b>
            <div class="hint">${q.options.map((o,j) => j===q.correct ? `<span class="ok">✓ ${esc(o)}</span>` : esc(o)).join(" · ")} · ${q.time}s</div></div>
            <div class="row"><button class="ghost sm" data-up="${i}" ${i===0?"disabled":""} aria-label="Move up">↑</button><button class="ghost sm danger" data-del="${i}" aria-label="Delete question">✕</button></div></li>`).join("") || `<li class="hint">No questions yet.</li>`}</ol></div>
      </div>` : `<div class="ed-main"><div class="card"><h2>Make your own quiz</h2><p class="muted">Create a quiz with your own questions, pictures and time limits. Press <b>+ New quiz</b> to start, or import a file you exported before.</p></div></div>`}
    </section>`;
  }
  // keep half-typed text when the editor re-renders
  function captureEditor(){ const ids = ["nq","no0","no1","no2","no3","ntime","lines","qztitle"], o = {};
    ids.forEach(id => { const el = document.getElementById(id); if (el) o[id] = el.value; });
    const c = document.querySelector('input[name="ncor"]:checked'); if (c) o.ncor = c.value; return o; }
  function restoreEditor(o){ for (const id in o) { if (id === "ncor") continue; const el = document.getElementById(id); if (el && o[id] !== undefined) el.value = o[id]; }
    if (o.ncor) { const r = document.getElementById("ncor" + o.ncor); if (r) r.checked = true; } }

  app.addEventListener("change", async e => {
    if (e.target.id === "srcsel") { S.source = e.target.value; return; }
    if (e.target.id === "qztitle") { const qz = editing(); if (qz) { qz.title = e.target.value.trim() || "Untitled quiz"; saveQuiz(qz); render(); } return; }
    if (e.target.id === "nimg" && e.target.files[0]) {
      try { S.editImg = await resizeImage(e.target.files[0]); render(); } catch(err) { toast("That picture couldn't be opened. Try a JPG or PNG."); } return; }
    if (e.target.id === "importfile" && e.target.files[0]) {
      try { const data = JSON.parse(await e.target.files[0].text());
        const list = (Array.isArray(data) ? data : [data]).filter(q => q && Array.isArray(q.questions));
        if (!list.length) throw new Error("none");
        for (const q of list) { q.id = "q" + uid(); q.title = String(q.title || "Imported quiz").slice(0,60);
          q.questions = q.questions.filter(x => x && x.text && Array.isArray(x.options) && x.options.length >= 2).slice(0, 200); saveQuiz(q); S.editId = q.id; }
        toast("Imported " + list.length + " quiz" + (list.length>1?"zes":"")); render();
      } catch(err) { toast("That file isn't a Playzo quiz export."); } }
  });

  app.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.closest(".game, .opt, .seg, [data-act]")) Sound.sfx("click");
    if (b.dataset.cat) { const sec = document.getElementById("cat-" + b.dataset.cat); if (sec) sec.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); return; }
    if (b.dataset.addbots) { addBots(Number(b.dataset.addbots), S.botLevel || "smart"); return; }
    if (b.dataset.botlevel) { S.botLevel = b.dataset.botlevel; render(); return; }
    if (b.dataset.host) { S.game = b.dataset.host; S.rules = null; S.view = "lobby"; if (!S.booted) boot(); else render(); return; }
    if (b.dataset.rules) { S.rules = b.dataset.rules; render(); setTimeout(() => { const c = document.querySelector("#rulesov .close"); if (c) c.focus(); }, 0); return; }
    if (b.dataset.mode) { S.mode = b.dataset.mode; broadcast(); render(); return; }
    if (b.dataset.teams) { S.teamCount = Number(b.dataset.teams);
      for (const pid in S.players) if (S.players[pid].team >= S.teamCount) S.players[pid].team = smallestTeam();
      broadcast(); render(); return; }
    if (b.dataset.open) { S.editId = b.dataset.open; S.editImg = null; render(); return; }
    if (b.dataset.del !== undefined) { const qz = editing(); qz.questions.splice(+b.dataset.del, 1); saveQuiz(qz); render(); return; }
    if (b.dataset.up !== undefined) { const qz = editing(), i = +b.dataset.up; [qz.questions[i-1], qz.questions[i]] = [qz.questions[i], qz.questions[i-1]]; saveQuiz(qz); render(); return; }
    const a = b.dataset.act;
    if (a === "music") { Sound.toggleMusic(); Sound.mood(S.phase === "lobby" || S.phase === "final" ? "lobby" : S.game); render(); }
    if (a === "sfx") { Sound.toggleSfx(); render(); }
    if (a === "reload") location.reload();
    if (a === "copy") { const u = joinUrl();
      (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast("Join link copied"), () => {
        const r = document.createRange(); r.selectNodeContents(document.getElementById("joinurl")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Link selected. Copy it."); }); }
    if (a === "shuffle") { shuffle(Object.keys(S.players)).forEach((pid,i) => S.players[pid].team = i % S.teamCount); broadcast(); render(); }
    if (a === "start" || a === "again") startGame();
    if (a === "skip") { if (S.phase === "mc") endMC(); else if (S.phase === "guess") endGuess(); else if (S.phase === "imp-vote") endVote(); }
    if (a === "vote") startVote();
    if (a === "ccfinish") ccFinishAll();
    if (a === "rmbots") removeBots();
    if (a === "selfplay") { if (!S.ready) { toast("Wait for the room to open"); return; }
      if (!S.selfOn) { S.selfOn = true; selfPanel(); render(); } else { const el = document.getElementById("selfpanel"); if (el) { el.classList.toggle("min"); document.body.classList.toggle("selfon", !el.classList.contains("min")); } } }
    if (a === "ludofinish") ludoFinishAll();
    if (a === "tyfinish") tyFinishAll();
    if (a === "slfinish") slFinishAll();
    if (a === "next") next();
    if (a === "lobby") toLobby();
    if (a === "editor") { S.view = "editor"; const all = Quizzes.all(); if (!S.editId && all.length) S.editId = all[0].id; render(); }
    if (a === "back") { S.view = "lobby"; render(); }
    if (a === "home") { if (S.phase !== "lobby" && S.phase !== "final") { toast("Finish or end the game first"); return; }
      if (S.phase === "final") toLobby(); S.view = "home"; S.rules = null; render(); }
    if (a === "closerules") { S.rules = null; render(); }
    if (a === "newquiz") { const qz = {id:"q" + uid(), title:"My quiz", questions:[]}; if (saveQuiz(qz)) { S.editId = qz.id; render(); setTimeout(() => { const t = document.getElementById("qztitle"); if (t) { t.focus(); t.select(); } }, 0); } }
    if (a === "delquiz") { if (b.dataset.sure) { Quizzes.save(Quizzes.all().filter(q => q.id !== S.editId)); if (S.source === S.editId) S.source = "builtin"; S.editId = null; render(); }
      else { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = "Delete quiz"; } }, 3000); } }
    if (a === "playthis") { S.source = S.editId; S.game = "quiz"; S.view = "lobby"; render(); toast("This quiz is ready. Press Start."); }
    if (a === "rmimg") { S.editImg = null; render(); }
    if (a === "addq") {
      const qz = editing(), text = document.getElementById("nq").value.trim();
      const raw = [0,1,2,3].map(i => document.getElementById("no"+i).value.trim());
      const cor = +document.querySelector('input[name="ncor"]:checked').value;
      if (!text) { toast("Type the question first"); return; }
      if (!raw[cor]) { toast("The answer marked correct is empty"); return; }
      const keep = raw.map((o,i) => ({o,i})).filter(x => x.o);
      if (keep.length < 2) { toast("Add at least two options"); return; }
      qz.questions.push({text, options: keep.map(x => x.o), correct: keep.findIndex(x => x.i === cor), time: +document.getElementById("ntime").value, img: S.editImg});
      if (!saveQuiz(qz)) { qz.questions.pop(); return; }
      S.editImg = null; ["nq","no0","no1","no2","no3"].forEach(id => document.getElementById(id).value = "");
      render(); toast("Question added"); }
    if (a === "addlines") {
      const qz = editing(), r = parseLines(document.getElementById("lines").value);
      if (!r.questions.length) { toast(r.bad.length ? "No lines could be read. Check the * before each right answer." : "Paste some lines first"); return; }
      qz.questions.push(...r.questions); if (!saveQuiz(qz)) return;
      document.getElementById("lines").value = ""; render();
      toast("Added " + r.questions.length + " question" + (r.questions.length>1?"s":"") + (r.bad.length ? ". Skipped line " + r.bad.join(", ") : "")); }
    if (a === "export") { const qz = editing(); const blob = new Blob([JSON.stringify(qz, null, 1)], {type:"application/json"});
      const url = URL.createObjectURL(blob), link = document.createElement("a"); link.href = url; link.download = (qz.title.replace(/[^\w-]+/g,"_") || "quiz") + ".json";
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
  });

  // close the rules sheet with Esc or a click outside it
  app.addEventListener("click", e => { if (e.target.id === "rulesov") { S.rules = null; render(); } });
  addEventListener("keydown", e => { if (e.key === "Escape" && S.rules) { S.rules = null; render(); } });
  Sound.mood("lobby");
  render();
}

/* ====================================================================== PLAYER */
function startPlayer(code){
  let pid = null;
  const PKEY = params.get("self") === "1" ? "sp-pid-self" : "sp-pid";
  try { pid = LOCAL ? sessionStorage.getItem(PKEY) : store.get(PKEY); } catch(e){}
  if (!pid) { pid = "u" + uid() + uid(); try { LOCAL ? sessionStorage.setItem(PKEY, pid) : store.set(PKEY, pid); } catch(e){} }
  const P = {status:"connecting", st:null, joined:false, name: store.get("sp-name") || "", av: Avatar.clean(store.get("sp-av")), team:null, ccWild:null, luSel:null, luTurn:-1, taps:0, tapRound:-1, recvAt:0, err:"", goAt:0, prevPhase:""};
  let link = null, tapTimer = 0;
  /* ---- push-to-talk: hold the button, speak, release to send ---- */
  const Voice = (() => {
    const bar = document.createElement("div"); bar.className = "voicebar"; bar.hidden = true;
    bar.innerHTML = `<span class="vhear" aria-live="polite"></span><button class="ghost xs vmute" aria-label="Mute voices">🔈</button><button class="ptt" aria-label="Hold to talk"><span class="mic">🎙</span><span class="ptt-l">Hold to talk</span></button>`;
    document.body.appendChild(bar);
    const btn = bar.querySelector(".ptt"), lab = bar.querySelector(".ptt-l"), hearEl = bar.querySelector(".vhear"), muteBtn = bar.querySelector(".vmute");
    let stream = null, rec = null, chunks = [], pressing = false, t0 = 0, maxT = 0, muted = store.get("sp-vmute") === "1";
    const q = []; let playing = false;
    const MIME = () => ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"].find(x => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x)) || "";
    async function start(){
      pressing = true; if (rec) return;
      if (!window.MediaRecorder || !navigator.mediaDevices) { toast("Voice isn't supported in this browser"); return; }
      try { stream = stream || await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); }
      catch(e){ toast("Allow the microphone to talk"); pressing = false; return; }
      if (!pressing) return;
      const mime = MIME(); chunks = [];
      try { rec = new MediaRecorder(stream, mime ? {mimeType:mime, audioBitsPerSecond:24000} : undefined); } catch(e){ rec = new MediaRecorder(stream); }
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = async () => {
        const type = (rec && rec.mimeType) || mime || "audio/webm", ms = Date.now() - t0; rec = null; bar.classList.remove("rec"); lab.textContent = "Hold to talk";
        if (ms < 350 || !chunks.length) return;
        const blob = new Blob(chunks, {type}), buf = await blob.arrayBuffer();
        if (buf.byteLength > 440000) { toast("That was too long. Keep it under 10 seconds."); return; }
        send({t:"voice", mime:type, data:buf}); Sound.sfx("click");
      };
      rec.start(); t0 = Date.now(); bar.classList.add("rec"); lab.textContent = "Talking… release to send";
      clearTimeout(maxT); maxT = setTimeout(stop, 10000);
    }
    function stop(){ pressing = false; clearTimeout(maxT); if (rec && rec.state === "recording") rec.stop(); }
    function next(){
      const m = q.shift(); if (!m) { playing = false; bar.classList.remove("hear"); hearEl.textContent = ""; return; }
      playing = true; bar.classList.add("hear"); hearEl.innerHTML = `${Avatar.svg(m.av, 22)}<b>${esc(m.from)}</b>`;
      const url = URL.createObjectURL(new Blob([m.data], {type: m.mime || "audio/webm"})), a = new Audio(url);
      const done = () => { URL.revokeObjectURL(url); next(); };
      a.onended = done; a.onerror = done; a.play().catch(() => { toast("🎙 " + m.from + " sent a voice message. Tap the screen to allow sound."); done(); });
    }
    btn.addEventListener("pointerdown", e => { e.preventDefault(); btn.setPointerCapture && btn.setPointerCapture(e.pointerId); start(); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener("contextmenu", e => e.preventDefault());
    muteBtn.addEventListener("click", () => { muted = !muted; store.set("sp-vmute", muted ? "1" : "0"); muteBtn.textContent = muted ? "🔇" : "🔈"; });
    muteBtn.textContent = muted ? "🔇" : "🔈";
    return {
      hear(m){ if (muted || !m.data) return; q.push(m); if (!playing) next(); },
      update(st){
        const show = P.joined && st && !(st.phase === "lobby" && st.mode !== "teams");
        bar.hidden = !show; if (!show) return;
        const grp = st.imp && st.imp.group && !st.imp.sitout;
        const who = grp ? "your group" : st.mode === "teams" ? ((st.teams.find(t => t.id === P.team) || {}).name || "your team") : "everyone";
        if (!rec) lab.textContent = "Hold to talk to " + who;
        bar.style.setProperty("--vc", st.mode === "teams" && !grp ? ((st.teams.find(t => t.id === P.team) || {}).c || "var(--t2)") : "var(--t2)");
      },
    };
  })();
  const send = m => { if (link) link.send(m); };

  link = net.join(code, {
    onOpen(){ P.status = "open"; if (P.joined) send({t:"join", pid, name:P.name, av:P.av, team:P.team}); render(); },
    onData(m){
      if (!m) return;
      if (m.t === "tick") { if (P.st) { P.st.endsIn = m.endsIn; P.recvAt = Date.now(); } return; }
      if (m.t === "voice") { Voice.hear(m); return; }
      if (m.t !== "state") return;
      const prev = P.st; P.st = m; P.recvAt = Date.now();
      if (m.you) { P.joined = true; P.team = m.you.team; }
      Voice.update(m);
      if (m.phase === "tap" && P.tapRound !== m.round) { P.tapRound = m.round; P.taps = 0; }
      if (m.lu && m.lu.turnId !== P.luTurn) { P.luTurn = m.lu.turnId; P.luSel = null; if (m.lu.myTurn) Sound.sfx("go"); }
      if (m.cc && !m.cc.myTurn) P.ccWild = null;
      if (m.ty && prev && prev.ty && !m.ty.sitout && !prev.ty.sitout && m.ty.cash > prev.ty.cash) Sound.sfx("coin");
      if ((m.ludo && m.ludo.myTurn && (!prev || !prev.ludo || !prev.ludo.myTurn)) || (m.ty && m.ty.myTurn && (!prev || !prev.ty || !prev.ty.myTurn)) || (m.sl && m.sl.myTurn && (!prev || !prev.sl || !prev.sl.myTurn))) Sound.sfx("go");
      if (m.cc && m.cc.myTurn && (!prev || !prev.cc || !prev.cc.myTurn)) Sound.sfx("go");
      if (m.phase === "react-go" && (!prev || prev.phase !== "react-go")) { P.goAt = performance.now(); Sound.sfx("go"); }
      if (prev && prev.phase !== m.phase) {
        if (m.phase === "mc-rev") Sound.sfx(m.gained > 0 ? "correct" : "wrong");
        if (m.phase === "guess-rev" || m.phase === "imp-res" || m.phase === "react-res" || m.phase === "tap-res") Sound.sfx(m.gained > 0 ? "correct" : "wrong");
        if (m.phase === "final") { Sound.sfx("win");
          const won = m.mode === "solo" ? m.you && m.you.rank === 1 : m.teams.slice().sort((a,b) => b.score - a.score)[0].id === P.team;
          if (won) Confetti.burst(5000); }
        if (m.phase === "mc" || m.phase === "guess" || m.phase === "imp-talk") Sound.sfx("pop");
      }
      render();
    },
    onClose(){ P.status = "lost"; render(); },
    onSlow(n){ if (P.status !== "open") { P.status = "slow"; P.tries = n; render(); } },
    onError(err){ P.err = err && err.type === "peer-unavailable" ? "Room " + code + " isn't open. Check the code on the big screen, or scan the QR code again."
        : err && err.type === "library" ? "The game couldn't load on this phone. Check your internet and try again."
        : "Connection problem. Check your internet. If you're on Wi-Fi, try phone data."; P.status = "error"; render(); },
  });

  const left = () => P.st ? Math.max(0, P.st.endsIn - (Date.now() - P.recvAt)) : 0;
  const team = () => P.st && P.team !== null && P.st.mode === "teams" ? P.st.teams.find(t => t.id === P.team) : null;
  setInterval(() => app.querySelectorAll("[data-left]").forEach(el => el.textContent = Math.ceil(left()/1000)), 250);

  function topbar(){
    const t = team(), st = P.st;
    const face = P.joined ? Avatar.svg(P.av, 32) : "";
    const who = P.joined ? (t ? `<span class="badge" style="--c:${t.c}">${esc(P.name)} · ${esc(t.name)}</span>`
      : `<span class="badge" style="--c:var(--t2)">${esc(P.name)}${st && st.you && st.phase !== "lobby" ? " · " + ordinal(st.you.rank) : ""}</span>`) : `<span class="pill">Room <b>${esc(code)}</b></span>`;
    return `<header class="ptop"><div class="brand sm"><span class="logo sm">PLAY<span>ZO</span></span><span class="byline">by Muntasir Mamun</span></div><div class="row"><button class="ghost xs" data-act="sfx" aria-label="Sound effects">${Sound.prefs.sfx ? "🔊" : "🔇"}</button>${face}${who}</div></header>`;
  }
  function render(){
    let body = ""; const st = P.st;
    if (P.status === "error") body = `<div class="msg"><h2>Can't join</h2><p class="muted">${esc(P.err)}</p><button data-act="reload">Try again</button></div>`;
    else if (!st && P.status === "slow") body = `<div class="msg"><h2>Still connecting…</h2>
      <p class="muted">Your phone can reach the game site but not the big screen yet (try ${P.tries}). It keeps trying by itself.</p>
      <ol class="fixlist"><li>Switch between Wi-Fi and mobile data, or join the same Wi-Fi as the big screen.</li>
        <li>Open the link in Chrome or Safari, not inside Facebook, Instagram or a QR scanner app.</li>
        <li>Turn off any VPN, ad blocker or Low Data Mode.</li></ol>
      <button data-act="reload">Try again</button></div>`;
    else if (!st) body = `<div class="msg"><h2>Joining room ${esc(code)}…</h2><p class="muted">Connecting to the big screen.</p>
      ${INAPP ? `<p class="warn">You opened this inside another app. If it stays on this screen, tap ⋯ or the share icon and choose <b>Open in browser</b>.</p>` : ""}</div>`;
    else if (!P.joined) body = joinForm(st);
    else if (st.phase === "lobby") body = lobbyWait(st);
    else if (st.phase === "mc") body = mcQ(st);
    else if (st.phase === "mc-rev") body = mcRev(st);
    else if (st.phase === "tap-ready") body = `<div class="msg"><div class="label">Round ${st.round+1} of ${st.total}</div><h2>Get ready to tap…</h2><div class="big-num" data-left>${Math.ceil(left()/1000)}</div></div>`;
    else if (st.phase === "tap") { const t = team();
      body = `<div class="msg"><div class="label">Tap! <b data-left>${Math.ceil(left()/1000)}</b> s</div>
        <button class="tapbtn" style="--c:${t?t.c:'var(--t2)'}" id="tapbtn">${P.taps}</button><div class="hint">${t ? "Pull for " + esc(t.name) + "!" : "Tap as fast as you can"}</div></div>`; }
    else if (st.phase === "react-wait" || st.phase === "react-go") body = reactPad(st);
    else if (st.phase === "guess") body = guessQ(st);
    else if (st.phase.startsWith("imp")) body = impPhone(st);
    else if (st.phase.endsWith("-res") || st.phase === "guess-rev") body = resultCard(st);
    else if (st.phase === "cc") body = ccPhone(st);
    else if (st.phase === "lu") body = luPhone(st);
    else if (st.phase === "ludo") body = ludoPhone(st);
    else if (st.phase === "ty") body = tyPhone(st);

    else if (st.phase === "final") body = finalPhone(st);
    const html = `<div class="phone">${topbar()}${P.status === "lost" ? `<div class="pill">Reconnecting…</div>` : ""}${body}<footer class="credit">Made by <b>Muntasir Mamun</b></footer></div>`;
    const key = html.replace(/data-left>\d+</g, "data-left><");
    if (key === lastKey) return;
    const nmEl = document.getElementById("nm"), typed = nmEl ? nmEl.value : null, gv = document.getElementById("gv"), guessTyped = gv ? gv.value : null;
    lastKey = key; app.innerHTML = html;
    if (typed !== null && document.getElementById("nm")) document.getElementById("nm").value = typed;
    if (guessTyped !== null && document.getElementById("gv")) document.getElementById("gv").value = guessTyped;
  }
  let lastKey = "";
  function joinForm(st){
    return `<form class="msg form" id="joinform"><h2>Join the game</h2>
      <div class="avpick"><button type="button" class="avbig" data-act="newav" aria-label="Make a new cartoon face">${Avatar.svg(P.av, 132)}</button>
        <div><div class="label">Your cartoon</div><button type="button" class="sm" data-act="newav">🎲 New look</button><p class="hint">Tap until you like it.</p></div></div>

      ${st.mode === "teams" ? `<div class="label">Pick a team</div><div class="teampick">${st.teams.map(x => `<button type="button" style="--c:${x.c}" data-pick="${x.id}" aria-pressed="${x.id===P.team}">${esc(x.name)}</button>`).join("")}</div>` : ""}
      <button class="big" type="submit">Join</button>${st.mode === "teams" ? `<p class="hint">No team picked? You'll join the smallest team.</p>` : ""}</form>`;
  }
  function lobbyWait(st){
    const t = team();
    return `<div class="msg"><div class="bounce">${Avatar.svg(P.av, 120)}</div><div class="label">You're in, ${esc(P.name)}!</div><h2 style="color:${t?t.c:'var(--t2)'}">${t ? esc(t.name) : "Get ready"}</h2>
      <p class="muted">Watch the big screen. The game starts when the host is ready.</p>
      ${st.mode === "teams" ? `<div class="teampick">${st.teams.map(x => `<button style="--c:${x.c}" data-team="${x.id}" aria-pressed="${x.id===P.team}">${esc(x.name)}</button>`).join("")}</div><p class="hint">Tap a team to switch.</p>` : ""}</div>`;
  }
  function mcQ(st){
    const q = st.q;
    if (st.mine !== undefined) return `<div class="msg"><div class="label">${st.round+1} of ${st.total}</div><h2>Answer locked in</h2>
      <div class="opt solo" style="--c:${OPT_COLORS[st.mine]}"><span class="shape">${SHAPES[st.mine]}</span>${esc(q.options[st.mine])}</div><p class="muted">Waiting for the others…</p></div>`;
    const title = q.kind === "emoji" ? `<div class="emoji sm">${esc(q.text)}</div>` : `<div class="ptext">${esc(q.text)}</div>`;
    return `<div class="label">${st.round+1} of ${st.total} · <b data-left>${Math.ceil(left()/1000)}</b> s</div>${title}
      ${q.img ? `<p class="hint">👀 Look at the picture on the big screen.</p>` : ""}
      <div class="popts ${q.options.length===2?"two":""}">${q.options.map((o,i) => `<button class="opt" style="--c:${OPT_COLORS[i]}" data-choice="${i}"><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  function mcRev(st){
    const herd = st.q.kind === "herd", ok = st.gained > 0;

    return `<div class="result ${ok?'ok':'no'}"><h2>${st.mine === undefined ? "Too slow!" : ok ? (herd ? "You're with the herd!" : "Correct!") : (herd ? "Not with the herd" : "Not quite")}</h2>
      <p>${ok ? `+${st.gained} points` : `${herd ? "Most people picked" : "The answer was"} <b>${esc(right)}</b>`}</p></div>${standing(st)}`;
  }
  function reactPad(st){

    if (mine) return `<div class="msg"><h2>${mine.early ? "Too early!" : Math.round(mine.ms) + " ms"}</h2><p class="muted">${mine.early ? "No points this round. Wait for green next time." : "Nice. Waiting for the others…"}</p></div>`;
    const goNow = st.phase === "react-go";

  }
  function guessQ(st){
    if (st.mine !== undefined) return `<div class="msg"><div class="label">${st.round+1} of ${st.total}</div><h2>You guessed ${fmt(st.mine)}</h2><p class="muted">Waiting for the others…</p></div>`;
    return `<form class="msg form" id="guessform"><div class="label">${st.round+1} of ${st.total} · <b data-left>${Math.ceil(left()/1000)}</b> s</div>
      <div class="ptext">${esc(st.q.text)}</div>
      <input id="gv" type="number" inputmode="decimal" step="any" placeholder="Your guess${st.q.unit ? " (" + esc(st.q.unit) + ")" : ""}" required>

  /* ---- card games on the phone ---- */

      <p>${C.winnerMe ? "+300 points" : "You had " + C.hand.length + " card" + (C.hand.length === 1 ? "" : "s") + " left"}</p><p class="hint">Waiting for the other tables to finish…</p></div>${standing(st)}`;

      <div class="colpick">${["r","g","b","y"].map(c => `<button data-ccol="${c}" style="background:${CC_COLORS[c]}">${CC_NAMES[c]}</button>`).join("")}</div>

      ${C.myTurn ? `<div class="row center-row">${C.drew ? `<button class="big" data-act="ccpass">Pass</button>` : `<button class="big" data-act="ccdraw">Draw a card</button>`}</div>

      </div>${wildPick}`;
  }
  function luPhone(st){
    const L = st.lu;
    if (!L || !L.inGame) return `<div class="msg"><h2>Watch this one</h2><p class="muted">Your team isn't in this game. Watch the big screen.</p></div>`;

    const sel = L.myTurn && P.luSel !== null && L.hand[P.luSel] !== undefined ? L.hand[P.luSel] : null;
    const myTeam = st.teams.find(t => t.id === P.team);

      : luDead(board, sel) ? "Both spaces for this card are taken. Swap it for a new card." : "Tap a glowing space.";
    return `<div class="lu-phone">
      <div class="turnbar ${L.myTurn ? "mine" : ""}" style="--c:${myTeam ? myTeam.c : "var(--t2)"}">${L.myTurn ? "Your turn!" : esc(L.turnName) + "'s turn"} · <b data-left>${Math.ceil(left()/1000)}</b> s</div>
      <p class="hint center">${hint}</p>
      <div class="lu-board sm">${board.map((b, i) => { const ok = sel && luOk(b, P.team, sel);
        return `<button class="lc ${luRed(b.c) ? "red" : ""} ${b.c === "*" ? "free" : ""} ${ok ? "ok" : ""} ${i === L.last ? "last" : ""}" ${ok ? `data-cell="${i}"` : "disabled"} aria-label="${b.c === "*" ? "Free corner" : luLabel(b.c)}">${luCell(b, i)}</button>`; }).join("")}</div>
      <div class="label">${L.myTurn ? "Your team's cards" : "Your team's cards (shared)"}</div>
      <div class="phand">${L.hand.map((c, i) => `<button class="pcard ${luRed(c) ? "red" : ""} ${P.luSel === i && L.myTurn ? "sel" : ""} ${luDead(board, c) ? "dead" : ""}" data-lui="${i}" ${L.myTurn ? "" : "disabled"}>${luLabel(c)}${LU_TWO.includes(c) ? "<small>👀 wild</small>" : LU_ONE.includes(c) ? "<small>👁 remove</small>" : ""}</button>`).join("")}</div>
      ${L.myTurn && sel && luDead(board, sel) && !L.swapped ? `<button class="big" data-act="luswap">Swap this dead card</button>` : ""}
      <div class="lu-seqs">${L.seqs.map(s => { const t = st.teams.find(x => x.id === s.id); return `<span style="--c:${t ? t.c : "#fff"}">${t ? esc(t.name) : ""} <b>${s.n}/${L.need}</b></span>`; }).join("")}</div>
      </div>`;
  }


  /* ---- Ludo and Tycoon Town on the phone ---- */
  function ludoPhone(st){
    const L = st.ludo;
    if (!L || L.sitout) return `<div class="msg"><h2>Watch this one</h2><p class="muted">You joined after the boards were set up. You'll be in the next game.</p></div>`;
    const col = LUDO_COL[L.seat];
    if (L.done) return `<div class="result ${L.winnerMe ? "ok" : "no"}"><h2>${L.winnerMe ? "You won your board! 🏆" : esc(L.winnerName) + " won your board"}</h2><p class="hint">Waiting for the other boards…</p></div>${standing(st)}`;
    const choosing = L.myTurn && L.rolled && L.moves.length > 1;
    const board = ludoBoardHTML({seats:L.seats, moved: L.moved && fresh("plm", L.moved.id) ? L.moved : null}, {pick: choosing ? L.moves.map(m => m.k) : null});
    const canRoll = L.myTurn && !L.rolled;
    const die = dieHTML(L.dice || 6, L.dice && fresh("pld", L.rollId), 72);
    const yard = L.mine.filter(p => p < 0).length, home = L.mine.filter(p => p >= LUDO_END).length;
    const say = canRoll ? "Tap the dice to roll!" : choosing ? "Tap a glowing token to move it" : L.myTurn ? "Moving…" : esc(L.turnName) + " is playing";
    return `<div class="board-phone">
      <div class="turnbar ${L.myTurn ? "mine" : ""}">${L.myTurn ? "Your turn!" : esc(L.turnName) + "'s turn"} · <b data-left>${Math.ceil(left()/1000)}</b> s</div>
      <div class="you-are" style="--tc:${col}">You are <b>${LUDO_NAME[L.seat]}</b> · ${yard} in yard · ${home} home</div>
      ${board}
      <div class="dicebar" style="--tc:${col}">${canRoll ? `<button class="diebtn" data-act="ludoroll" aria-label="Roll the dice">${die}</button>` : `<div class="diebtn off">${die}</div>`}
        <div><b class="say ${canRoll || choosing ? "hot" : ""}">${say}</b><p class="hint">${esc(L.log)}</p></div></div></div>`;
  }
  function slPhone(st){
    const T = st.sl;
    if (!T || T.sitout) return `<div class="msg"><h2>Watch this one</h2><p class="muted">You joined after the boards were set up. You'll be in the next game.</p></div>`;
    if (T.done) return `<div class="result ${T.winnerMe ? "ok" : "no"}"><h2>${T.winnerMe ? "You reached 100! 🏆" : esc(T.winnerName) + " won your board"}</h2><p class="hint">Waiting for the other boards…</p></div>${standing(st)}`;
    const col = SL_COL[T.seat];
    return `<div class="board-phone">
      <div class="turnbar ${T.myTurn ? "mine" : ""}">${T.myTurn ? "Your turn!" : esc(T.turnName) + "'s turn"} · <b data-left>${Math.ceil(left()/1000)}</b> s</div>
      <div class="cashrow" style="--tc:${col}"><span class="label">You're on</span><span class="cash">${T.pos || "Start"}</span><span class="hint">${T.pos ? (100 - T.pos) + " to go" : "roll to begin"}</span></div>
      ${snakesBoardHTML({seats:T.seats, moved: T.moved && fresh("psm", T.moved.id) ? T.moved : null}, {})}
      <div class="row center-row">${T.dice ? dieHTML(T.dice, fresh("psd", T.rollId), 62) : ""}<p class="hint" style="max-width:24ch">${esc(T.log)}</p></div>
      ${T.myTurn ? `<button class="big rollbtn" data-act="slroll" style="--tc:${col}">🎲 Roll the dice</button>` : ""}</div>`;
  }
  function tyPhone(st){
    const T = st.ty;
    if (!T || T.sitout) return `<div class="msg"><h2>Watch this one</h2><p class="muted">You joined after the towns were set up. You'll be in the next game.</p></div>`;
    if (T.done) return `<div class="result ${T.winnerMe ? "ok" : "no"}"><h2>${T.winnerMe ? "Richest in town! 🏆" : esc(T.winnerName) + " is the richest"}</h2><p>You finished with $${T.cash}</p><p class="hint">Waiting for the other towns…</p></div>${standing(st)}`;
    if (T.out) return `<div class="msg"><h2>You ran out of money 💸</h2><p class="muted">Watch the big screen to see who wins.</p></div>`;
    const here = TY[T.pos], col = TY_COL[T.seat];
    const card = T.card && fresh("ptc", T.card.id) && T.card.mine ? `<div class="luckcard">🎁 ${esc(T.card.t)}</div>` : "";
    let controls = "";
    if (T.myTurn && !T.rolled) controls = `<button class="big rollbtn" data-act="tyroll" style="--tc:${col}">🎲 Roll the dice</button>`;
    else if (T.buy) controls = `<div class="buybox" style="--g:${TY_GROUPS[T.buy.g]}"><span class="band"></span><b>${esc(T.buy.n)}</b><span>Price $${T.buy.$} · rent $${Math.round(T.buy.$ / 10)}</span>
      <div class="row center-row"><button class="big" data-act="tybuy">Buy for $${T.buy.$}</button><button class="ghost big" data-act="tyskip">Skip</button></div></div>`;
    return `<div class="board-phone">
      <div class="turnbar ${T.myTurn ? "mine" : ""}">${T.myTurn ? "Your turn!" : esc(T.turnName) + "'s turn"} · <b data-left>${Math.ceil(left()/1000)}</b> s</div>
      <div class="cashrow" style="--tc:${col}"><span class="label">Your cash</span><span class="cash">$${T.cash}</span><span class="hint">on ${esc(here.n)}</span></div>
      <div class="row center-row">${dieHTML(T.dice[0], fresh("ptd1", T.rollId), 54)}${dieHTML(T.dice[1], fresh("ptd2", T.rollId), 54)}<p class="hint" style="max-width:22ch">${esc(T.log)}</p></div>
      ${card}${controls}
      <div class="label">Your streets (${T.mine.length})</div>
      <div class="streets">${T.mine.map(i => `<span class="street" style="--g:${TY_GROUPS[TY[i].g]}">${esc(TY[i].n)}</span>`).join("") || `<span class="hint">None yet. Land on an empty street to buy it.</span>`}</div>
      <div class="label">Players</div>
      <div class="cc-seats col">${T.players.map(p => `<div class="seat ${p.me ? "turn" : ""} ${p.out ? "out" : ""}" style="border-left:6px solid ${TY_COL[p.seat]}">${Avatar.svg(p.av, 24)}<span class="sn">${esc(p.name)}</span><span class="cnt">$${p.cash}${p.out ? " · out" : ""}</span></div>`).join("")}</div></div>`;
  }

  function impPhone(st){
    const I = st.imp;
    if (!I || I.sitout) return `<div class="msg"><h2>Sit this round out</h2><p class="muted">You joined after the groups were made. You'll be in the next round.</p></div>`;
    if (st.phase === "imp-talk") return `<div class="secret ${I.imposter ? "imp" : ""}"><div class="label">${esc(I.group)} · keep it secret</div>
        ${I.imposter ? `<h2>You are the IMPOSTER</h2><p>The category is <b>${esc(I.cat)}</b>. Listen to the clues and blend in.</p>` : `<div class="label">Secret word</div><div class="word">${esc(I.word)}</div><p class="muted">Category: ${esc(I.cat)}</p>`}</div>
      <div class="card"><p><b>${esc(I.first)}</b> starts. Each person says one word linked to the secret word. Then vote.</p>
      <div class="hint">In your group: ${I.others.map(o => esc(o.name)).join(", ")}</div><p class="hint">Voting in <b data-left>${Math.ceil(left()/1000)}</b> s</p></div>`;
    if (st.phase === "imp-vote") {
      if (st.mine) { const o = I.others.find(o => o.pid === st.mine); return `<div class="msg"><h2>You voted for ${esc(o ? o.name : "?")}</h2><p class="muted">Waiting for the others…</p></div>`; }
      return `<div class="label">${esc(I.group)} · <b data-left>${Math.ceil(left()/1000)}</b> s</div><h2>Who is the imposter?</h2>
        <div class="votes">${I.others.map(o => `<button data-vote="${esc(o.pid)}">${esc(o.name)}</button>`).join("")}</div>`;
    }
    const R = I.result;
    return `<div class="result ${st.gained > 0 ? "ok" : "no"}"><h2>${R.caught ? "Imposter caught!" : "Imposter escaped!"}</h2>
      <p>The imposter was <b>${esc(R.imposter)}</b>. The word was <b>${esc(R.word)}</b>.</p><p>+${st.gained} points</p></div>${standing(st)}`;
  }
  function resultCard(st){
    let line = "";
    if (st.phase === "tap-res") line = `You tapped ${P.taps} times.`;
    if (st.phase === "react-res") line = st.mine && !st.mine.early ? `Your time: ${Math.round(st.mine.ms)} ms` : st.mine ? "You tapped too early." : "You didn't tap.";
    if (st.phase === "guess-rev") line = st.mine !== undefined ? `Answer ${fmt(st.answer)} · you guessed ${fmt(st.mine)}` : `The answer was ${fmt(st.answer)}`;
    return `<div class="result ${st.gained > 0 ? "ok" : "no"}"><h2>+${st.gained || 0} points</h2><p>${esc(line)}</p></div>${standing(st)}`;
  }
  function standing(st){
    if (st.mode === "solo") return `<div class="card center"><div class="label">Your place</div><div class="big-num">${ordinal(st.you.rank)}</div><div class="muted">of ${st.you.of} · ${fmt(st.you.pts)} points</div></div>`;
    const order = st.teams.slice().sort((a,b)=>b.score-a.score), max = Math.max(1, ...order.map(t=>t.score));
    return `<div class="card"><div class="label">Team scores</div><div class="bars">${order.map(t => `<div class="bar sm" style="--c:${t.c}"><div class="nm">${esc(t.name)}</div><div class="tr"><i style="width:${Math.max(2,100*t.score/max)}%"></i></div><div class="v">${fmt(t.score)}</div></div>`).join("")}</div></div>`;
  }
  function finalPhone(st){
    if (st.mode === "solo") return `<div class="msg"><div class="bounce">${Avatar.svg(P.av, 120, {crown: st.you.rank === 1})}</div><div class="label">Final</div><h2>${st.you.rank === 1 ? "You won! 🏆" : "You came " + ordinal(st.you.rank)}</h2>${standing(st)}<p class="hint">Watch the big screen for the next game.</p></div>`;
    const order = st.teams.slice().sort((a,b)=>b.score-a.score), place = order.findIndex(t => t.id === P.team) + 1;
    return `<div class="msg"><div class="bounce">${Avatar.svg(P.av, 120, {crown: place === 1})}</div><div class="label">Final</div><h2>${place === 1 ? "Your team won! 🏆" : "Your team came " + ordinal(place)}</h2>${standing(st)}<p class="hint">Watch the big screen for the next game.</p></div>`;
  }

  app.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pick) { Sound.sfx("click"); P.team = Number(b.dataset.pick); const nm = document.getElementById("nm"); if (nm) P.name = nm.value; render(); return; }
    if (b.dataset.team) { Sound.sfx("click"); P.team = Number(b.dataset.team); send({t:"join", pid, name:P.name, av:P.av, team:P.team}); return; }
    if (b.dataset.choice) { Sound.sfx("pop"); send({t:"answer", r:P.st.round, choice:Number(b.dataset.choice)}); b.classList.add("pressed"); return; }
    if (b.dataset.vote) { Sound.sfx("pop"); send({t:"vote", r:P.st.round, target:b.dataset.vote}); return; }
    if (b.dataset.cc !== undefined) { const i = +b.dataset.cc, c = P.st.cc.hand[i]; Sound.sfx("pop");
      if (c && c[0] === "w") { P.ccWild = i; render(); } else send({t:"cc", a:"play", i}); return; }
    if (b.dataset.ccol) { Sound.sfx("pop"); send({t:"cc", a:"play", i:P.ccWild, color:b.dataset.ccol}); P.ccWild = null; render(); return; }
    if (b.dataset.lui !== undefined) { Sound.sfx("click"); P.luSel = +b.dataset.lui; render(); return; }
    if (b.dataset.cell !== undefined) { Sound.sfx("pop"); send({t:"lu", a:"play", i:P.luSel, cell:+b.dataset.cell}); P.luSel = null; return; }
    if (b.dataset.act === "ludoroll") { Sound.sfx("dice"); send({t:"ludo", a:"roll"}); return; }
    if (b.dataset.lmove !== undefined) { Sound.sfx("pop"); send({t:"ludo", a:"move", k:+b.dataset.lmove}); return; }
    if (b.dataset.act === "slroll") { Sound.sfx("dice"); send({t:"sl", a:"roll"}); return; }
    if (b.dataset.act === "tyroll") { Sound.sfx("dice"); send({t:"ty", a:"roll"}); return; }
    if (b.dataset.act === "tybuy") { Sound.sfx("buy"); send({t:"ty", a:"buy"}); return; }
    if (b.dataset.act === "tyskip") { Sound.sfx("click"); send({t:"ty", a:"skip"}); return; }
    if (b.dataset.act === "ccdraw") { Sound.sfx("click"); send({t:"cc", a:"draw"}); return; }
    if (b.dataset.act === "ccpass") { Sound.sfx("click"); send({t:"cc", a:"pass"}); return; }
    if (b.dataset.act === "ccnowild") { P.ccWild = null; render(); return; }
    if (b.dataset.act === "luswap") { Sound.sfx("click"); send({t:"lu", a:"swap", i:P.luSel}); P.luSel = null; return; }
    if (b.dataset.act === "sfx") { Sound.toggleSfx(); render(); }
    if (b.dataset.act === "newav") { Sound.sfx("pop"); const nm = document.getElementById("nm"); if (nm) P.name = nm.value;
      P.av = Avatar.random(); store.set("sp-av", P.av); render(); return; }
    if (b.dataset.act === "reload") location.reload();
  });
  app.addEventListener("pointerdown", e => {
    if (!P.st) return;
    const tb = e.target.closest("#tapbtn");
    if (tb && P.st.phase === "tap") { e.preventDefault(); P.taps++; tb.textContent = P.taps; Sound.sfx("drum");
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch(_){} }
      if (!tapTimer) tapTimer = setTimeout(() => { tapTimer = 0; send({t:"taps", r:P.st.round, n:P.taps}); }, 400); return; }
    const rp = e.target.closest("#reactpad");
    if (rp && P.st.mine === undefined) { e.preventDefault();
      if (P.st.phase === "react-wait") { send({t:"react", r:P.st.round, early:true}); Sound.sfx("wrong"); P.st.mine = {early:true}; }
      else if (P.st.phase === "react-go") { const ms = performance.now() - P.goAt; send({t:"react", r:P.st.round, ms}); Sound.sfx("correct"); P.st.mine = {ms}; }
      render(); }
  });
  app.addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.id === "joinform") { P.name = document.getElementById("nm").value.replace(/\s+/g," ").trim().slice(0,18) || "Player"; store.set("sp-name", P.name);
      store.set("sp-av", P.av); Sound.sfx("join"); send({t:"join", pid, name:P.name, av:P.av, team:P.team}); }
    if (e.target.id === "guessform") { const v = Number(document.getElementById("gv").value); if (isFinite(v)) { Sound.sfx("pop"); send({t:"guess", r:P.st.round, value:v}); } }
  });
  render();
}

if (JOIN) startPlayer(JOIN); else startHost();

</script>
</body>
</html>
