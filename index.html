<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playzo</title>
<meta name="description" content="Playzo by Muntasir Mamun: QR party games for groups: trivia, Guess the Imposter, Tug of War and more. Scan, pick a team, play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: host = big-screen game show (QR + stage); player = one-thumb phone controller. Single dark arcade look by choice. */
:root{
  --ink:#15122e; --panel:#211d45; --panel-2:#2c2760; --line:#3d3780;
  --text:#f4f1ff; --muted:#a9a3d6; --good:#3ddc84; --bad:#ff6b6b;
  --t0:#ff5a5f; --t1:#19c3b4; --t2:#ffc23d; --t3:#8c6cff;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:var(--ink);background:var(--text);padding:12px 18px;font-weight:700;transition:transform .08s}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--t2);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.sm{padding:8px 14px;font-size:.92rem;border-radius:11px}
.xs{padding:4px 9px;font-size:1rem;border-radius:9px}
.big{font-size:1.15rem;padding:16px 26px}
.danger{color:var(--bad);border-color:rgba(255,107,107,.4)}
input,select,textarea{font:inherit;font-size:1.05rem;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel-2);color:var(--text)}
select{width:auto;min-width:0;max-width:100%}
textarea{resize:vertical}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em;text-wrap:balance}
.h-sm{font-size:1.05rem}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:1.6rem;line-height:1}
.logo.sm{font-size:1rem;white-space:nowrap}
.logo span{color:var(--t2)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem;color:var(--muted)}
.pill b{color:var(--text);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.hint{font-size:.86rem;color:var(--muted)}
.warn{font-size:.88rem;color:var(--t2);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.spread{justify-content:space-between}
.center{text-align:center;align-items:center}
.center-row{justify-content:center}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(260px,350px) 1fr;gap:18px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;position:sticky;top:12px}
#qr{background:#fff;padding:14px;border-radius:16px;line-height:0}
#qr svg{display:block;width:min(270px,70vw);height:auto}
.qrfail{color:#15122e;padding:30px 16px;line-height:1.4;max-width:240px}
.code{font-family:var(--display);font-size:2.4rem;letter-spacing:.18em;color:var(--t2)}
.url{font-size:.82rem;color:var(--muted);word-break:break-all}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.game{background:var(--panel-2);border:2px solid transparent;color:var(--text);text-align:left;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;font-weight:400}
.game[aria-pressed="true"]{border-color:var(--t2);box-shadow:0 0 0 4px rgba(255,194,61,.15)}
.gtag{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--t2);font-weight:700}
.gname{font-family:var(--display);font-size:1.05rem}
.gdesc{font-size:.85rem;color:var(--muted)}
.src{margin-top:14px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.team{border-radius:16px;padding:12px 14px;background:var(--panel-2);border-top:6px solid var(--c);min-width:0}
.team h3{font-size:1rem;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips.cloud{max-height:260px;overflow:auto}
.chip{background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px;font-size:.86rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.off{opacity:.45}
.chip.more{background:var(--t2);color:var(--ink);font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--panel-2);border-radius:12px;padding:4px;gap:4px}
.seg button{background:transparent;color:var(--text);padding:6px 14px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
/* question stage */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,2.7rem);line-height:1.15}
.emoji{font-size:clamp(3rem,10vw,6.5rem);line-height:1.1;letter-spacing:.08em}
.emoji.sm{font-size:3rem;text-align:center}
.qgrid{display:grid;gap:18px;align-items:center}
.qgrid.has-img{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
@media (max-width:760px){.qgrid.has-img{grid-template-columns:1fr}}
.qimg{width:100%;max-height:46vh;object-fit:contain;border-radius:16px;background:#fff}
.timer{height:12px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--t2);border-radius:99px;transition:width .2s linear}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:14px;border-radius:18px;padding:18px;background:var(--c);color:#14112a;font-weight:700;font-size:1.2rem;text-align:left;min-height:80px}
.opt .shape{font-size:1.5rem;width:1.6rem;text-align:center}
.opt .cnt{margin-left:auto;font-family:var(--display);font-size:1.1rem}
.opt.dim{opacity:.28}
.opt.right{outline:5px solid var(--good);outline-offset:3px}
.opt.solo{justify-content:center;width:100%}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(52px,auto);gap:12px;align-items:center}
.bar.sm{grid-template-columns:minmax(80px,120px) 1fr auto}
.bar .nm{font-weight:700;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:30px;background:var(--panel-2);border-radius:10px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c);border-radius:10px;transition:width .3s ease}
.bar .v{font-family:var(--display);text-align:right;font-variant-numeric:tabular-nums}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums}
.board .rk{font-family:var(--display);color:var(--t2)}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rope{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.rope .side{font-family:var(--display);color:var(--c);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:1rem;text-align:center}
.rope .side b{font-size:1.8rem}
.rope .track{position:relative;height:18px;background:repeating-linear-gradient(90deg,#c9a36a 0 14px,#a8834d 14px 28px);border-radius:9px}
.rope .mid{position:absolute;left:50%;top:-14px;bottom:-14px;width:3px;background:var(--text);opacity:.6}
.rope .knot{position:absolute;top:50%;width:26px;height:46px;transform:translate(-50%,-50%);background:linear-gradient(var(--bad) 0 50%,#fff 50% 100%);border-radius:6px;box-shadow:0 0 0 3px var(--ink);transition:left .35s ease}
.react{min-height:44vh;justify-content:center;border:0}
.react.wait{background:#7a1f2b}
.react.go{background:#1f7a46}
.react h2{font-size:clamp(2rem,6vw,4rem)}
.steps{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:6px;max-width:75ch}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.grp{background:var(--panel-2);border-radius:14px;padding:12px;min-width:0}
.grp.won{border-left:5px solid var(--good)}
.grp.lost{border-left:5px solid var(--bad)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-top:16px}
.pod{width:min(190px,28vw);min-width:96px;text-align:center;display:flex;flex-direction:column;gap:6px}
.pod .blk{background:var(--c);color:#14112a;border-radius:16px 16px 6px 6px;font-family:var(--display);font-size:2rem;display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
.pod .tn{font-family:var(--display);color:var(--c);font-size:1rem;overflow:hidden;text-overflow:ellipsis}
.win{font-size:clamp(1.8rem,5vw,3rem);animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.big-num{font-family:var(--display);font-size:clamp(2.6rem,9vw,5rem);line-height:1;color:var(--t2)}
/* editor */
.editor{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:18px;align-items:start}
@media (max-width:860px){.editor{grid-template-columns:1fr}}
.ed-side{display:flex;flex-direction:column;gap:12px}
.ed-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-main .card{display:flex;flex-direction:column;gap:10px}
.qzlist{display:flex;flex-direction:column;gap:6px}
.qzitem{background:var(--panel-2);color:var(--text);text-align:left;display:flex;flex-direction:column;font-weight:400;border:2px solid transparent}
.qzitem[aria-pressed="true"]{border-color:var(--t2)}
.filebtn{display:inline-flex;align-items:center;cursor:pointer;font-weight:700}
.optedit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.optedit{grid-template-columns:1fr}}
.oe{display:flex;align-items:center;gap:8px;border-left:6px solid var(--c);padding-left:8px;border-radius:6px}
.oe input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--good)}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:8px;background:#fff;vertical-align:middle}
.eg{background:var(--panel-2);padding:10px 12px;border-radius:10px;overflow-x:auto;margin:0}
.qlist{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:8px}
.qlist li{display:flex;gap:10px;align-items:center}
.qli{flex:1;min-width:0}
.ok{color:var(--good);font-weight:700}
/* player */
.phone{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px;min-height:100%}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptop .row{flex-wrap:nowrap;min-width:0;justify-content:flex-end}
.badge{border-radius:999px;padding:6px 12px;font-weight:700;background:var(--c,var(--panel));color:#14112a;font-size:.88rem;max-width:52vw;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teampick{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.teampick button{background:var(--c);color:#14112a;min-height:64px;font-size:1.02rem}
.teampick button[aria-pressed="true"]{outline:4px solid var(--text);outline-offset:3px}
.ptext{font-weight:700;font-size:1.2rem}
.popts{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.popts.two{grid-template-columns:1fr}
.popts .opt{flex-direction:column;justify-content:center;text-align:center;min-height:118px;font-size:1.02rem}
.opt.pressed{filter:brightness(1.15)}
.tapbtn{border-radius:50%;aspect-ratio:1;align-self:center;width:min(76vw,400px);font-family:var(--display);font-size:2.4rem;background:var(--c,var(--t2));color:#14112a;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.tapbtn:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.reactpad{flex:1;min-height:62vh;border-radius:24px;font-family:var(--display);font-size:2rem;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.reactpad.wait{background:#a3263a}
.reactpad.go{background:#20a35a}
.msg{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:18px 0}
.msg.form{align-items:stretch;text-align:left}
.msg.form h2{text-align:center}
.msg h2{font-size:1.6rem}
.result{border-radius:20px;padding:20px;text-align:center}
.result.ok{background:rgba(61,220,132,.15);border:2px solid var(--good)}
.result.no{background:rgba(255,107,107,.12);border:2px solid var(--bad)}
.secret{border-radius:20px;padding:22px;text-align:center;background:var(--panel-2);border:2px solid var(--t1)}
.secret.imp{border-color:var(--bad);background:rgba(255,107,107,.14)}
.secret .word{font-family:var(--display);font-size:2.4rem;color:var(--t1);margin:6px 0}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.votes button{background:var(--panel-2);color:var(--text);border:2px solid var(--line);min-height:60px;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100vw - 32px)}

/* v3: home page, avatars, live joins, finale */
.logo-btn{background:none;border:0;padding:0;color:inherit;border-radius:8px}
.top{min-height:52px}
.strip{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;flex-wrap:wrap}
.strip>b{font-family:var(--display);font-variant-numeric:tabular-nums}
.stack{display:flex;padding-left:10px;min-width:0;max-width:100%;overflow:hidden}
@media (max-width:760px){.strip{order:3;flex-basis:100%;justify-content:flex-start}}
.sav{display:inline-flex;margin-left:-10px;border-radius:50%;background:var(--panel-2);box-shadow:0 0 0 3px var(--ink)}
.sav.new{animation:pop .5s ease}
.joined{background:var(--good);color:var(--ink);font-weight:700;border-radius:999px;padding:4px 12px;font-size:.88rem;animation:pop .4s ease}
.av{display:block;flex:none}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center;padding-block:8px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2rem,5.2vw,3.6rem);line-height:1.02;margin:8px 0 10px}
.hero p{max-width:60ch;margin:0}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.how li{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700}
.how b{font-family:var(--display);width:34px;height:34px;border-radius:50%;background:var(--t2);color:var(--ink);display:grid;place-items:center;flex:none}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-color:var(--good)}
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-3px);border-color:var(--c)}
.gcard::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--c)}
.gicon{width:76px;height:76px;border-radius:20px;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.gicon svg{width:58px;height:58px}
.gbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.gcard .gname,.chosen .gname{font-size:1.25rem}
.gdesc{font-size:.92rem;color:var(--muted);margin:0}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:4px}
.gact{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.chosen{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;border-top:5px solid var(--c)}
.chosen .src{grid-column:1 / -1}
.chosen .row{margin-top:6px}
.overlay{position:fixed;inset:0;background:rgba(10,8,30,.72);display:grid;place-items:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:22px;padding:22px;max-width:620px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0}
.sheet h3{margin-top:6px}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head h2{font-size:1.6rem}
.sheet-head .close{margin-left:auto;align-self:flex-start}
.rules{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:6px}
.chip.av{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px}
.chip.new{background:var(--good);color:var(--ink);animation:pop .5s ease}
.board .nm{display:flex;align-items:center;gap:10px;min-width:0}
.board .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board.narrow{max-width:560px;width:100%;margin:0 auto;text-align:left}
.improw{display:flex;align-items:center;gap:10px;margin:6px 0}
.finale{position:relative;overflow:hidden;text-align:center;align-items:center}
.finale>*{position:relative}
.spot{position:absolute!important;inset:-20% -10% auto;height:120%;background:radial-gradient(ellipse at 50% 0%,rgba(255,194,61,.28),transparent 60%);pointer-events:none}
.win-head{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.trophy{width:84px;height:84px;animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-6px)}}
.win{font-size:clamp(2rem,6vw,3.6rem);animation:pop .7s ease;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:16px;width:100%}
.pod{width:min(210px,29vw);min-width:100px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pod-avs{display:flex;justify-content:center;align-items:flex-end}
.pod-avs .av+.av{margin-left:-14px}
.pod.p1 .pod-avs{animation:float 2.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pod .tn{font-family:var(--display);color:var(--c);font-size:1.05rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font-weight:700;color:var(--muted)}

.catnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;background:var(--ink);scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catchip{flex:none;background:var(--panel);color:var(--text);border:2px solid var(--c);border-radius:999px;padding:8px 14px;font-size:.92rem}
.catchip b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--c);color:var(--ink);font-size:.78rem;margin-left:4px}
.catsec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:70px;padding-top:6px}
.cathead{display:flex;align-items:center;gap:14px;border-left:6px solid var(--c);padding:4px 0 4px 14px}
.cathead h2{font-size:1.5rem}
.cathead p{margin:2px 0 0;font-size:.92rem}
.caticon{font-size:2rem}
.catcount{margin-left:auto;font-size:.82rem;color:var(--muted);white-space:nowrap}
.gcard h3.gname{font-family:var(--display);font-weight:400;margin:0;font-size:1.2rem}

/* v10: Ludo Star style controls */
button.tok{padding:0;border:0;cursor:pointer;font:inherit}
.tok.pick{width:8%;z-index:4;animation:pickpulse .9s ease-in-out infinite;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--tc),0 0 18px 6px var(--tc)}
.tok.pick::before{content:"";position:absolute;inset:-70%;border-radius:50%}
@keyframes pickpulse{0%,100%{transform:translate(-50%,-62%) scale(1)}50%{transform:translate(-50%,-78%) scale(1.12)}}
.dicebar{display:flex;align-items:center;gap:14px;background:var(--panel);border-left:6px solid var(--tc);border-radius:16px;padding:10px 14px}
.dicebar p{margin:4px 0 0}
.diebtn{background:none;border:0;padding:6px;border-radius:18px;flex:none}
button.diebtn{animation:pickpulse2 1s ease-in-out infinite;box-shadow:0 0 0 3px var(--tc),0 0 20px 4px var(--tc);cursor:pointer}
@keyframes pickpulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.diebtn.off{opacity:.85}
.say.hot{color:var(--t2)}

/* v11: realistic boards (wood frames, glossy surfaces, 3D pawns) */
.bframe{position:relative;width:100%;max-width:min(100%,72vh);margin:0 auto;border-radius:20px;padding:clamp(8px,2.4%,18px);box-sizing:border-box}
.bframe.wood{background:
  linear-gradient(90deg,rgba(0,0,0,.18),transparent 12%,transparent 88%,rgba(0,0,0,.2)),
  linear-gradient(180deg,rgba(255,255,255,.14),transparent 30%,rgba(0,0,0,.18)),
  repeating-linear-gradient(7deg,#8b5a2b 0 5px,#7a4b22 5px 8px,#9a6636 8px 15px,#83532a 15px 19px);
  box-shadow:0 22px 44px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.4)}
.bframe.dark{background:linear-gradient(180deg,#3a2616,#24170d);box-shadow:0 22px 44px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(0,0,0,.5)}
.bframe.tilt{transform:perspective(1500px) rotateX(15deg);transform-origin:50% 100%}
.board-phone .bframe{max-width:100%;padding:6px;border-radius:14px}
.bframe .ludo,.bframe .slboard,.bframe .tyb{max-width:none;width:100%;margin:0}
.ludo.tilt .lgrid,.slboard.tilt .slgrid,.slboard.tilt .slart{transform:none}
.lgrid{border:0;border-radius:10px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.2);background:#f7f4ec}
.lgrid .path{background:linear-gradient(145deg,#ffffff,#ebe7dc);border:1px solid rgba(21,18,46,.16);box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.lgrid .path.safe{color:#c9a227;text-shadow:0 1px 0 #fff}
.lgrid .h0,.lgrid .y0{background:linear-gradient(145deg,#ff7a87,#d42a40)}
.lgrid .h1,.lgrid .y1{background:linear-gradient(145deg,#4fdc90,#1b9455)}
.lgrid .h2,.lgrid .y2{background:linear-gradient(145deg,#ffd75e,#dc9a00)}
.lgrid .h3,.lgrid .y3{background:linear-gradient(145deg,#64a8ff,#2361cf)}
.lgrid .path.h0,.lgrid .path.h1,.lgrid .path.h2,.lgrid .path.h3{border-color:rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.12)}
.lgrid .yard{box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.35)}
.lgrid .yin{display:grid;grid-template-columns:1fr 1fr;place-items:center;width:70%;height:70%;padding:10%;box-sizing:border-box;background:linear-gradient(145deg,#fffdf8,#ece7da);border-radius:18%;box-shadow:inset 0 3px 6px rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.18)}
.lgrid .yin i{width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ddd7c8);box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 0 0 3px var(--yc)}
.lgrid .y0 .yin i{--yc:#d42a40}.lgrid .y1 .yin i{--yc:#1b9455}.lgrid .y2 .yin i{--yc:#dc9a00}.lgrid .y3 .yin i{--yc:#2361cf}
.lgrid .center{background:conic-gradient(from 45deg,#2fbf71 0 25%,#f5b622 0 50%,#3d8bff 0 75%,#ff4d5e 0);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 0 18px rgba(0,0,0,.25)}
.lcenter-star{display:grid;place-items:center;color:#fff;font-size:clamp(1rem,3vw,2.4rem);text-shadow:0 2px 4px rgba(0,0,0,.45);z-index:1;pointer-events:none}
.tok{width:5.2%;aspect-ratio:40/54;border-radius:0;background:none;box-shadow:none;transform:translate(-50%,-88%)}
.tok .pawn{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.tok.me::after{content:"";position:absolute;left:4%;right:4%;bottom:2%;height:16%;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px 2px #fff;z-index:-1}
.tok.hop{animation:hop2 .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes hop2{0%{transform:translate(-50%,-88%)}35%{transform:translate(-50%,-170%) scale(1.18)}70%{transform:translate(-50%,-82%) scale(1.05,.95)}100%{transform:translate(-50%,-88%)}}
.tok.pick{width:7.4%;box-shadow:none;animation:pickpulse3 .9s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px var(--tc))}
@keyframes pickpulse3{0%,100%{transform:translate(-50%,-88%) scale(1)}50%{transform:translate(-50%,-104%) scale(1.1)}}

.slgrid{border:0;border-radius:10px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}

.slc.b{background:linear-gradient(145deg,#eef8ff,#c9e5f7)}

.slc:nth-child(4n).b{background:linear-gradient(145deg,#f0fbf2,#c9ecd2)}
.slc span{font-family:var(--display);font-weight:400;color:#7a7392;font-size:clamp(.42rem,.95vw,.8rem)}
.slc.goal{background:radial-gradient(circle at 40% 35%,#ffe28a,#f0b400)!important}
.slart{filter:none}
.tyb{background:#2a1a0e;gap:3px;padding:3px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.tt{background:linear-gradient(180deg,#fffdf6,#ece2c8);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 0 0 3px var(--own,transparent),inset 0 -2px 0 rgba(0,0,0,.08)}
.tt .band{position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tt .band::after{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent)}
.tt.corner{background:linear-gradient(145deg,#fff6d5,#f1dc9c)}
.tt.go .ticon{color:#e5383b}
.tycenter{background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),radial-gradient(circle at 50% 35%,#38a862,#1d7442 60%,#12502a);box-shadow:inset 0 0 26px rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.35)}
.tylogo{background:linear-gradient(180deg,#fff2b0,#ffc23d 55%,#d68b00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #6b3d00) drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.tytok{display:inline-block;width:clamp(12px,2.2vw,26px);aspect-ratio:40/54;background:none;box-shadow:none;border-radius:0}
.tytok .pawn{width:100%;height:100%;display:block}
.tyb.small .tytok{width:13px}
.tytok.me{box-shadow:none;filter:drop-shadow(0 0 4px #fff)}
.tok.me{box-shadow:none}
/* push-to-talk */
.voicebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px)}
.voicebar .ptt{display:flex;align-items:center;gap:8px;background:var(--vc,var(--t2));color:var(--ink);border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.4);user-select:none;-webkit-user-select:none;touch-action:none;white-space:nowrap}
.voicebar .ptt .mic{font-size:1.3rem}
.voicebar.rec .ptt{background:#ff4d5e;color:#fff;animation:pickpulse2 .8s ease-in-out infinite;box-shadow:0 0 0 6px rgba(255,77,94,.35),0 10px 24px rgba(0,0,0,.4)}
.voicebar .vmute{background:var(--panel);border-color:var(--line)}
.voicebar .vhear{display:none;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--good);border-radius:999px;padding:4px 10px 4px 4px;font-size:.85rem}
.voicebar.hear .vhear{display:flex;animation:pop .3s ease}
.phone{padding-bottom:84px}
.pill.talking{border-color:var(--good);color:var(--text);animation:pop .3s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

var qrcode = function() {

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

      var bits = QRUtil.getBCHTypeInfo(data);

        } else if (i < 8) {

        } else {

      for (var i = 0; i < 15; i += 1) {

        if (i < 8) {

        } else {
          _modules[8][15 - i - 1] = mod;
        }

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;

                bitIndex = 7;

          if (row < 0 || _moduleCount <= row) {

            break;
          }

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

/* ------------------------------------------------------------ confetti for winners */
const Confetti = (() => {
  let cv = null, parts = [], raf = 0, until = 0;
  const cols = ["#ff5a5f","#19c3b4","#ffc23d","#8c6cff","#ffffff","#ff8fd0"];
  function add(n){ const d = devicePixelRatio || 1;
    for (let i = 0; i < n; i++) parts.push({x: Math.random()*cv.width, y: -20*d - Math.random()*cv.height*0.3, vx:(Math.random()-.5)*3*d, vy:(2+Math.random()*3.5)*d,
      w:(6+Math.random()*7)*d, h:(4+Math.random()*5)*d, a:Math.random()*6, va:(Math.random()-.5)*.25, c:pick(cols)}); }
  function loop(){
    const g = cv.getContext("2d"); g.clearRect(0, 0, cv.width, cv.height);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.w/2, -p.h/2, p.w, p.h); g.restore(); }
    parts = parts.filter(p => p.y < cv.height + 40);
    if (Date.now() < until) add(4);
    if (parts.length) raf = requestAnimationFrame(loop); else { raf = 0; cv.hidden = true; }
  }
  return {
    burst(ms = 5000){
      try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch(e){}
      if (!cv) { cv = document.createElement("canvas"); cv.className = "confetti"; cv.setAttribute("aria-hidden", "true"); document.body.appendChild(cv); }
      cv.hidden = false; const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d;
      add(160); until = Date.now() + ms; if (!raf) loop();
    },
  };
})();

const CC_COLORS = {r:"#ff5a5f", g:"#3ddc84", b:"#4d9fff", y:"#ffc23d"};
const CC_NAMES = {r:"Red", g:"Green", b:"Blue", y:"Yellow"};
function ccLabel(c){ const v = c.slice(1); if (c[0] === "w") return v === "4" ? "+4" : "★"; return v === "S" ? "⊘" : v === "R" ? "⇄" : v === "+" ? "+2" : v; }
function ccName(c){ const v = c.slice(1); if (c[0] === "w") return v === "4" ? "Wild +4" : "Wild";
  return CC_NAMES[c[0]] + " " + (v === "S" ? "Skip" : v === "R" ? "Reverse" : v === "+" ? "+2" : v); }
function ccPlayable(c, top, color){ return c[0] === "w" || c[0] === color || (top[0] !== "w" && c.slice(1) === top.slice(1)); }
function ccCard(c, cls = ""){ return `<span class="ucard ${c[0]} ${cls}" aria-label="${esc(ccName(c))}"><b>${ccLabel(c)}</b></span>`; }

// Line Up 5 cards: rank + suit, e.g. "10H", "QS". Corners are free spaces "*".
const LU_SUIT = {S:"♠", H:"♥", D:"♦", C:"♣"};
const LU_TWO = ["JD","JC"], LU_ONE = ["JS","JH"];   // two-eyed jacks are wild, one-eyed jacks remove a chip
function luLabel(c){ return c === "*" ? "★" : c.slice(0, -1) + LU_SUIT[c.slice(-1)]; }
const luRed = c => /[HD]$/.test(c);
function luOk(b, team, card){
  if (!b) return false;
  if (LU_TWO.includes(card)) return b.c !== "*" && b.t === -1;
  if (LU_ONE.includes(card)) return b.c !== "*" && b.t !== -1 && b.t !== team && !b.lock;
  return b.c === card && b.t === -1;
}
function luDead(board, card){ return !card.startsWith("J") && !board.some(b => b.c === card && b.t === -1); }
function luCell(b, i, extra = ""){
  const chip = b.t >= 0 ? `<i class="chip ${b.lock ? "lock" : ""}" style="--c:${TEAMS[b.t].c}"></i>` : "";
  return `<span class="lab">${b.c === "*" ? "★" : luLabel(b.c)}</span>${chip}${extra}`;
}

function ludoCell(seat, p, k){
  if (p < 0) return LUDO_YARD[seat][k];

function ludoBoardHTML(L, opt = {}){
  // L = {seats:[{seat, av, name, tokens:[p,p], me}], moved:{seat,k}|null}
  const cls = (r, c) => {

const SL_LADDERS = [[4,25],[13,46],[33,49],[42,63],[50,69],[62,81],[74,92]];

function slXY(n){ // center of square n in 0..100 units
  if (n < 1) return [-4, 95];
  const r = Math.floor((n - 1) / 10), k = (n - 1) % 10, c = r % 2 === 0 ? k : 9 - k;
  return [(c + 0.5) * 10, (9 - r + 0.5) * 10];
}
let SL_ART = null;
function slArt(){
  if (SL_ART) return SL_ART;

    const [x1, y1] = slXY(a), [x2, y2] = slXY(b), dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), px = -dy / len * 1.9, py = dx / len * 1.9;
    let rungs = "", rs = "", rh = "";
    for (let t = 0.07; t < 0.97; t += 4 / len) { const ax = x1 + dx*t + px, ay = y1 + dy*t + py, bx = x1 + dx*t - px, by = y1 + dy*t - py;
      rs += `<line x1="${ax + .5}" y1="${ay + .7}" x2="${bx + .5}" y2="${by + .7}"/>`; rungs += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"/>`; rh += `<line x1="${ax}" y1="${ay - .25}" x2="${bx}" y2="${by - .25}"/>`; }

    s += `<g class="ladder"><g stroke="#000" stroke-width="1" opacity=".28" stroke-linecap="round">${rs}</g>${rail(.6, 1.6, "#000", .28)}

    s += `<g class="snake"><path d="${d}" stroke="#000" stroke-width="4.6" fill="none" stroke-linecap="round" opacity=".3" transform="translate(.8 1.1)"/>
      <path d="${d}" stroke="${c3}" stroke-width="4.4" fill="none" stroke-linecap="round"/>
      <path d="${d}" stroke="${c1}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="${d}" stroke="${c2}" stroke-width="1.6" fill="none" stroke-dasharray=".9 1.3" stroke-linecap="round" opacity=".9"/>

/* ------------------------------------------------------------ network */
const net = {
  host(code, h){
    if (LOCAL) {
      const ch = new BroadcastChannel(PREFIX + code), links = {};
      ch.onmessage = e => { const m = e.data; if (m.to !== "host") return;
        if (m.kind === "open") { const L = {id:m.from, send:d=>ch.postMessage({to:m.from,kind:"data",msg:d})}; links[m.from]=L; h.onConnect(L); }
        else if (m.kind === "data" && links[m.from]) h.onData(links[m.from], m.msg);
        else if (m.kind === "close" && links[m.from]) { h.onClose(links[m.from]); delete links[m.from]; } };
      setTimeout(() => h.onReady(), 50);
      return;
    }
    if (typeof Peer !== "function") { setTimeout(() => h.onError({type:"library"}), 0); return; }
    getIce().then(iceServers => {
    const peer = new Peer(PREFIX + code, {config:{iceServers}});
    peer.on("open", () => h.onReady());
    peer.on("error", err => h.onError(err));
    peer.on("disconnected", () => { try { peer.reconnect(); } catch(e){} });
    peer.on("connection", conn => {
      const L = {id: conn.peer, send: d => { if (conn.open) try { conn.send(d); } catch(e){} }};
      conn.on("open", () => h.onConnect(L));
      conn.on("data", d => h.onData(L, d));
      conn.on("close", () => h.onClose(L));
      conn.on("error", () => h.onClose(L));
    });
    });
  },
  join(code, h){
    if (LOCAL) {
      const ch = new BroadcastChannel(PREFIX + code), me = "p" + uid();
      ch.onmessage = e => { const m=e.data; if (m.to===me && m.kind==="data") h.onData(m.msg); };
      ch.postMessage({to:"host",from:me,kind:"open"});
      addEventListener("pagehide", () => ch.postMessage({to:"host",from:me,kind:"close"}));
      setTimeout(() => h.onOpen(), 30);
      return { send: d => ch.postMessage({to:"host",from:me,kind:"data",msg:d}) };
    }
    if (typeof Peer !== "function") { setTimeout(() => h.onError({type:"library"}), 0); return {send(){}}; }
    let conn = null, alive = true, peer = null, tries = 0;
    // Try again if the direct connection hasn't opened after 12 seconds.
    const connect = () => {
      if (!alive || !peer) return;
      const c = conn = peer.connect(PREFIX + code, {reliable:true}); tries++;
      const guard = setTimeout(() => { if (!c.open && alive && conn === c) { try { c.close(); } catch(e){} h.onSlow && h.onSlow(tries); connect(); } }, 12000);
      c.on("open", () => { clearTimeout(guard); h.onOpen(); });
      c.on("data", d => h.onData(d));
      c.on("close", () => { clearTimeout(guard); if (conn !== c) return; h.onClose(); if (alive) setTimeout(connect, 2000); });
      c.on("error", () => {});
    };
    getIce().then(iceServers => {
      peer = new Peer({config:{iceServers}});
      peer.on("open", connect);
      peer.on("error", err => h.onError(err));
      peer.on("disconnected", () => { try { peer.reconnect(); } catch(e){} });
    });
    addEventListener("pagehide", () => { alive = false; });
    return { send: d => { if (conn && conn.open) try { conn.send(d); } catch(e){} } };
  },
};

// One question per line:  Question? | Option | *Correct option | Option | Option   (add "| 30s" for a time limit)
function parseLines(text){
  const out = [], bad = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    let parts = line.split("|").map(s => s.trim()).filter(Boolean);
    let time = 20;
    const tm = parts.length && parts[parts.length-1].match(/^(\d{1,3})\s*s(ec(onds?)?)?$/i);
    if (tm) { time = Math.min(120, Math.max(5, +tm[1])); parts.pop(); }

    const one = S.stables.length === 1, done = S.stables.filter(t => t.done).length;

      <p class="hint">Roll and move. 🪜 Ladders take you up, 🐍 snakes take you down. A 6 rolls again. You need to land exactly on 100: roll too high and you bounce back.</p></section>`;
  }

  function hype(){
    if (S.phase === "cc") return (S.tables || []).some(T => !T.done && T.players.some(x => T.hands[x].length === 1)) ? 2 : 1;
    if (S.phase === "lu") return S.lu && S.lu.need > 1 && S.lu.teams.some(t => S.lu.seqs[t] >= S.lu.need - 1) ? 2 : 1;
    if (S.phase === "ludo") return (S.ltables || []).some(T => !T.done && T.players.some(x => T.tok[x].some(p => p >= 46))) ? 2 : 1;
    if (S.phase === "sl") return (S.stables || []).some(T => !T.done && T.players.some(x => T.pos[x] >= 80)) ? 2 : 1;
    if (S.phase === "ty") return (S.ttables || []).some(T => !T.done && T.round >= CFG.tyRounds - 1) ? 2 : 1;
    return 1;
  }
  function next(){
    if (S.round + 1 >= S.total) { S.phase = "final"; S.endsAt = 0; Sound.mood("lobby"); Sound.sfx("win"); broadcast(); render(); Confetti.burst(6500); return; }
    S.round++;
    if (S.phase === "mc-rev") startMC(); else if (S.phase === "tap-res") startTapReady();
    else if (S.phase === "react-res") startReactWait(); else if (S.phase === "guess-rev") startGuess();
    else if (S.phase === "imp-res") startImposter();
  }
  function toLobby(){ S.phase = "lobby"; S.round = 0; S.answers = {}; S.endsAt = 0; resetScores(); Sound.mood("lobby"); broadcast(); render(); }

  let lastSec = -1;
  setInterval(() => {
    if (S.phase === "react-wait" && S.goAt && Date.now() >= S.goAt) { S.goAt = 0; startReactGo(); return; }
    if (["cc","lu","ludo","ty","sl"].includes(S.phase)) {
      if (S.phase === "cc") ccTick(); else if (S.phase === "lu") luTick(); else if (S.phase === "ludo") ludoTick(); else if (S.phase === "sl") slTick(); else tyTick();
      app.querySelectorAll("[data-ends]").forEach(el => { el.textContent = Math.ceil(Math.max(0, +el.dataset.ends - Date.now()) / 1000); });
      Sound.intensity(hype());
      return;
    }
    if (!S.endsAt) Sound.intensity(1);
    if (!S.endsAt) return;
    const left = S.endsAt - Date.now();
    if (left <= 0) {
      if (S.phase === "mc") endMC(); else if (S.phase === "tap-ready") startTap(); else if (S.phase === "tap") endTap();
      else if (S.phase === "react-go") endReact(); else if (S.phase === "guess") endGuess();
      else if (S.phase === "imp-talk") startVote(); else if (S.phase === "imp-vote") endVote();
      return;
    }
    const sec = Math.ceil(left / 1000);
    const urgent = sec <= 5 && ["mc","guess","imp-vote","tap"].includes(S.phase);
    Sound.intensity(urgent ? 2 : 1);
    if (sec !== lastSec) { lastSec = sec; if (urgent) Sound.sfx("tick", sec); }
    tick();
  }, 200);
  // Keep phone timers in step without resending everything.
  setInterval(() => { if (!S.endsAt) return; const m = {t:"tick", endsIn: Math.max(0, S.endsAt - Date.now())};
    for (const pid in S.players) { const p = S.players[pid]; if (p.on && p.link) p.link.send(m); } }, 3000);
  let rq = 0; function soon(){ rankCache = null; if (S.view === "editor") return; if (!rq) rq = requestAnimationFrame(() => { rq = 0; render(); }); }

  /* ---- bots: computer players (Easy or Smart). ?bots=N adds N smart bots at start ---- */
  const BOT_NAMES = ["Robo Ruby","Byte Bob","Chip Chloe","Pixel Pete","Neo Nina","Glitch Gus","Sparky Sue","Turbo Tom","Data Dee","Bolt Ben",
    "Echo Ella","Gizmo Gil","Nova Nell","Rusty Ray","Widget Wu","Zappy Zed","Cyber Cy","Laser Liv","Mecha Max","Ping Pia"];
  let botN = 0;
  const isEasy = pid => S.players[pid] && S.players[pid].level === "easy";
  function addBots(n, level){
    for (let i = 0; i < n; i++) { const k = botN++, extra = k >= BOT_NAMES.length ? " " + (Math.floor(k / BOT_NAMES.length) + 1) : "";
      const L = {id:"bot" + k, bot:true, level, last:"", send(st){ if (st.t === "state") bot(L, st); }};
      handle(L, {t:"join", pid:"bot" + k, name:"🤖 " + BOT_NAMES[k % BOT_NAMES.length] + extra, av:Avatar.random(), team:null}); }
    render();
  }
  function removeBots(){
    for (const [pid, p] of plist()) if (p.bot) { delete S.players[pid]; delete S.links[pid]; }
    S.recent = S.recent.filter(pid => S.players[pid]); rankCache = null; broadcast(); render();
  }
  function bot(L, st){
    const key = st.phase + ":" + st.round; if (L.last === key) return; L.last = key;
    const smart = L.level !== "easy", later = (ms, m) => setTimeout(() => handle(L, m), ms);
    if (st.phase === "mc" && st.mine === undefined) { const n = st.q.options.length, q = S.list[S.round];
      let choice = Math.floor(Math.random() * n);
      if (q.correct >= 0 && Math.random() < (smart ? 0.85 : 0.45)) choice = q.correct;
      if (q.kind === "herd" && smart) { const c = q.options.map(() => 0); for (const k in S.answers) c[S.answers[k].choice]++; const mx = Math.max(...c); if (mx > 0) choice = c.indexOf(mx); }
      const wait = smart ? 700 + Math.random() * 3500 : 2500 + Math.random() * Math.max(1000, st.endsIn - 3500);
      later(Math.min(wait, Math.max(300, st.endsIn - 400)), {t:"answer", r:st.round, choice}); }
    if (st.phase === "tap") { let n = 0; const speed = smart ? 7 + Math.random() * 2 : 3 + Math.random() * 2;
      const iv = setInterval(() => { n += Math.round(speed * 0.5); handle(L, {t:"taps", r:st.round, n}); if (S.phase !== "tap") clearInterval(iv); }, 500); }
    if (st.phase === "react-go") { const early = Math.random() < (smart ? 0.01 : 0.08);
      later(early ? 50 : 200, early ? {t:"react", r:st.round, early:true} : {t:"react", r:st.round, ms: smart ? 220 + Math.random() * 110 : 330 + Math.random() * 320}); }
    if (st.phase === "guess") { const a = S.list[S.round][1], spread = smart ? 0.3 : 1;
      later(1500 + Math.random() * 8000, {t:"guess", r:st.round, value: Math.round(a * (1 - spread / 2 + Math.random() * spread))}); }
    if (st.phase === "imp-vote" && st.imp && st.imp.others && st.imp.others.length) {
      const g = S.groups.find(g => g.members.includes(L.id));
      const sus = g && g.imposter !== L.id && Math.random() < (smart ? 0.7 : 0.35) ? g.imposter : pick(st.imp.others).pid;
      later(1000 + Math.random() * 8000, {t:"vote", r:st.round, target: sus}); }
  }
